name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        run: |
          cd bez_paniki_android_studio_project/app/..
          # переходим в папку, где лежит gradlew (обычно внутри android или корня проекта)
          # если gradlew лежит внутри app или рядом с ним:
          find . -name "gradlew"
          # Запускаем сборку из папки, где найден gradlew
          GRADLE_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
