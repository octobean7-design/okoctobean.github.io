name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Find and Build
        run: |
          # Ищем папку android в репозитории
          ANDROID_DIR=$(find . -type d -name "android" | head -n 1)
          echo "Found android dir: $ANDROID_DIR"
          
          # Переходим в родительскую папку андроида и ставим зависимости, если есть package.json
          PARENT_DIR=$(dirname "$ANDROID_DIR")
          if [ -f "$PARENT_DIR/package.json" ]; then
            cd "$PARENT_DIR"
            npm install
            npx cap sync
            cd -
          fi
          
          # Собираем APK
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
